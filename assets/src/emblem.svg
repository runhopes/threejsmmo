<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="75%">
      <stop offset="0" stop-color="#2f5a5e"/><stop offset=".55" stop-color="#1a3239"/><stop offset="1" stop-color="#0c171c"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="1"/><stop offset=".35" stop-color="#f3b45c" stop-opacity=".85"/><stop offset="1" stop-color="#f3b45c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d79a"/><stop offset=".5" stop-color="#c29a5b"/><stop offset="1" stop-color="#7d5a2c"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc9c4" stop-opacity="0"/><stop offset="1" stop-color="#9fc9c4" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1d20"/><stop offset="1" stop-color="#07100f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="600" r="330" fill="url(#sun)"/>
  <!-- god rays -->
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  <g opacity=".22" fill="#ffe7b0" filter="url(#soft)">
    <path d="M512 600 L300 0 L380 0Z"/><path d="M512 600 L600 0 L690 0Z"/><path d="M512 600 L860 0 L960 60Z"/><path d="M512 600 L40 120 L110 40Z"/>
  </g>
  <!-- distant hills -->
  <path d="M0 760 Q180 660 340 720 T700 700 T1024 730 V1024 H0Z" fill="#163036" opacity=".9"/>
  <!-- ancient tree: buttress roots, massive trunk, crown roofing the frame -->
  <g fill="url(#tree)">
    <path d="M430 1024 C440 900 452 800 470 690 C478 640 472 590 456 540 L568 540 C552 590 546 640 554 690 C572 800 584 900 594 1024Z"/>
    <path d="M300 1024 C360 960 420 930 470 860 L470 1024Z"/>
    <path d="M724 1024 C664 960 604 930 554 860 L554 1024Z"/>
    <path d="M470 560 C420 500 330 470 250 480 C320 450 400 440 470 500Z"/>
    <path d="M554 560 C604 500 694 470 774 480 C704 450 624 440 554 500Z"/>
  </g>
  <!-- lobed canopy: clustered leaf masses, lit from the low sun below -->
  <g fill="#0b1a1c">
    <circle cx="512" cy="250" r="140"/><circle cx="360" cy="290" r="125"/><circle cx="664" cy="290" r="125"/>
    <circle cx="230" cy="380" r="110"/><circle cx="794" cy="380" r="110"/><circle cx="420" cy="410" r="130"/><circle cx="604" cy="410" r="130"/>
    <circle cx="160" cy="455" r="70"/><circle cx="864" cy="455" r="70"/><circle cx="300" cy="470" r="90"/><circle cx="724" cy="470" r="90"/>
  </g>
  <g></g>
  <!-- leaf-light rim on the crown -->
  <path d="M250 250 C330 150 430 112 512 110 C594 112 694 150 774 250" fill="none" stroke="#e7c27e" stroke-opacity=".22" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
  <!-- ground mist -->
  <rect y="760" width="1024" height="264" fill="url(#mist)"/>
  <!-- bronze ring -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#bronze)" stroke-width="22" opacity=".9"/>
  <circle cx="512" cy="512" r="444" fill="none" stroke="#f1d79a" stroke-opacity=".25" stroke-width="4"/>
  <!-- sword planted in the roots -->
  <g transform="translate(512 0)">
    <path d="M-14 610 L14 610 L10 900 L0 935 L-10 900Z" fill="url(#bronze)"/>
    <rect x="-70" y="590" width="140" height="24" rx="10" fill="url(#bronze)"/>
    <rect x="-11" y="500" width="22" height="92" rx="6" fill="#6a4a24"/>
    <circle cx="0" cy="492" r="20" fill="url(#bronze)"/>
  </g>
</svg>
