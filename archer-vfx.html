<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okçu VFX Tezgâhı (dev)</title>
<style>
  :root { --bg:#16252f; --panel:rgba(12,22,30,.88); --line:rgba(160,200,230,.2); --txt:#dcecf7; --dim:#8fb0c6; --acc:#e3b540; --acc2:#7fc4e8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font:12px/1.4 system-ui,Segoe UI,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  #ctl { top:10px; left:10px; width:292px; max-height:calc(100% - 20px); overflow:auto; }
  #ctl.hide > :not(#ctlHead) { display:none; }
  #ctlHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:700; letter-spacing:.04em; }
  #ctl h3 { margin:10px 0 4px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .row { display:flex; flex-wrap:wrap; gap:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  button { all:unset; cursor:pointer; padding:4px 8px; border-radius:5px; border:1px solid var(--line); background:rgba(255,255,255,.04); font-weight:600; text-align:left; }
  button:hover { background:rgba(255,255,255,.12); }
  button.on { background:var(--acc); color:#1b1b1b; border-color:var(--acc); }
  button.sk { display:flex; gap:6px; align-items:center; padding:5px 7px; }
  button.sk b { display:inline-block; min-width:16px; text-align:center; padding:0 3px; border-radius:3px; background:rgba(255,255,255,.12); font:700 11px ui-monospace,Consolas,monospace; }
  button.sk.cur { border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc); }
  label { display:grid; grid-template-columns:104px 1fr 40px; align-items:center; gap:6px; margin:2px 0; }
  label.ck { display:flex; gap:6px; }
  label span.v { text-align:right; font:11px ui-monospace,Consolas,monospace; color:var(--dim); }
  input[type=range] { width:100%; accent-color:var(--acc); }
  select { background:#0d1820; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 4px; }
  #info { top:10px; right:10px; width:268px; font:11px/1.55 ui-monospace,Consolas,monospace; white-space:pre; max-height:calc(100% - 20px); overflow:auto; }
  #info .h { color:var(--acc); font-weight:700; }
  #info .d { color:var(--dim); }
  #hint { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); font:11px system-ui; color:var(--dim); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; pointer-events:none; white-space:nowrap; }
  #err { position:fixed; left:320px; top:8px; color:#ff6b6b; font:12px monospace; white-space:pre-wrap; z-index:9; }
  #dump { position:fixed; inset:20% 25%; display:none; flex-direction:column; gap:6px; z-index:10; }
  #dump textarea { flex:1; background:#0b141a; color:var(--txt); border:1px solid var(--line); border-radius:6px; font:11px ui-monospace,Consolas,monospace; padding:8px; }
  #flash { position:fixed; top:12px; left:50%; transform:translateX(-50%); padding:4px 12px; border-radius:6px; background:var(--panel); border:1px solid var(--acc); font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="flash"></div>
<div id="ctl" class="panel">
  <div id="ctlHead"><span>OKÇU VFX TEZGÂHI</span><button id="fold" title="Paneli gizle (Tab)">—</button></div>
  <h3>Yetenekler</h3>
  <div class="grid" id="skills"></div>
  <div class="row" style="margin-top:5px"><button id="replay">Tekrar · Space</button><button id="loop">Döngü · L</button><button id="all">Hepsi · A</button><button id="clear">Temizle · R</button></div>

  <h3>Zaman</h3>
  <label>Zaman ölçeği<input type="range" id="timeScale" min="0.05" max="1.5" step="0.05" value="1"><span class="v" id="timeScaleV"></span></label>
  <label>Saldırı hızı<input type="range" id="atkSpeed" min="0.5" max="2" step="0.02" value="1.08"><span class="v" id="atkSpeedV"></span></label>
  <div class="row"><button id="pause">Duraklat · P</button><button id="step">Kare + · .</button></div>

  <h3>Efekt ayarı</h3>
  <label>İz gücü<input type="range" id="t_trail" min="0" max="2" step="0.05"><span class="v" id="t_trailV"></span></label>
  <label>Darbe yoğunluğu<input type="range" id="t_impact" min="0" max="2" step="0.05"><span class="v" id="t_impactV"></span></label>
  <label>Çekiş / aura<input type="range" id="t_charge" min="0" max="2" step="0.05"><span class="v" id="t_chargeV"></span></label>
  <label>Bırakış<input type="range" id="t_release" min="0" max="2" step="0.05"><span class="v" id="t_releaseV"></span></label>
  <label>Kalıntı süresi<input type="range" id="t_linger" min="0.2" max="2" step="0.05"><span class="v" id="t_lingerV"></span></label>
  <label>Efekt süresi<input type="range" id="t_life" min="0.4" max="2" step="0.05"><span class="v" id="t_lifeV"></span></label>
  <label>Kalite<select id="quality"><option value="high">Yüksek</option><option value="medium">Orta</option><option value="low">Düşük</option></select><span></span></label>
  <div class="row"><button id="eagleSim">Kartal Gözü etkin · E</button></div>

  <h3>Yetenek zamanlaması</h3>
  <label>Seri atış oku<input type="range" id="rapidCount" min="3" max="5" step="1" value="5"><span class="v" id="rapidCountV"></span></label>
  <label>Yelpaze açısı<input type="range" id="t_volleySpread" min="0.08" max="0.3" step="0.01"><span class="v" id="t_volleySpreadV"></span></label>
  <label>Sağanak dalga<input type="range" id="r_waves" min="2" max="8" step="1"><span class="v" id="r_wavesV"></span></label>
  <label>Dalga başına ok<input type="range" id="r_perWave" min="2" max="10" step="1"><span class="v" id="r_perWaveV"></span></label>
  <label>Dalga arası (s)<input type="range" id="r_interval" min="0.08" max="0.4" step="0.01"><span class="v" id="r_intervalV"></span></label>
  <label>İlk dalga (s)<input type="range" id="r_lead" min="0.3" max="1.2" step="0.05"><span class="v" id="r_leadV"></span></label>
  <div class="row"><button id="rainDots">İniş gölgeleri</button></div>

  <h3>Hedefler</h3>
  <label>Mesafe (m)<input type="range" id="dist" min="5" max="16" step="0.5" value="9"><span class="v" id="distV"></span></label>
  <label>Şerit yönü<select id="lane"><option value="right">Sağa (yatay)</option><option value="up">Yukarı (uzaklaşan)</option><option value="down">Aşağı (yaklaşan)</option><option value="left">Sola</option><option value="diag">Çapraz</option></select><span></span></label>
  <div class="row"><button id="moving">Hareketli · M</button><button id="creatures">Yaratıklar</button><button id="wall">Taş duvar</button><button id="stress">Stres (4 okçu)</button></div>

  <h3>Kamera</h3>
  <div class="row" id="camRow"></div>
  <h3>Zemin</h3>
  <div class="row" id="groundRow"></div>
  <h3>Hata ayıklama</h3>
  <div class="row"><button id="caps">Vuruş kapsülleri · H</button><button id="stats" class="on">İstatistik</button><button id="copy">Ayarları kopyala</button><button id="reset">Ayarları sıfırla</button></div>
</div>
<div id="info" class="panel"></div>
<div id="hint">1–9 yetenek · Space tekrar · sol tık hedef seç · orta tuş döndür · tekerlek yakınlaş · C kamera · [ ] zaman · P duraklat</div>
<div id="dump" class="panel"><textarea id="dumpText" readonly></textarea><div class="row"><button id="dumpClose">Kapat</button></div></div>

<script>window.addEventListener('error', (e) => { document.getElementById('err').textContent += 'ERR: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')\n'; document.title = 'ERR'; });</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="textures.js"></script>
<script src="locomotion.js"></script>
<script src="heromodel.js"></script>
<script src="knight.js"></script>
<script src="creatures/defs.js"></script>
<script src="creatures/core.js"></script>
<script src="creatures/species/goblin.js"></script>
<script src="creatures/species/wolf.js"></script>
<script src="village/core.js"></script>
<script src="village/materials.js"></script>
<script src="village/terrain.js"></script>
<script src="village/architecture.js"></script>
<script src="village/fortifications.js"></script>
<script src="village/props.js"></script>
<script src="village/phtex.js"></script>
<script src="village/forest.js"></script>
<script src="village/atmosphere.js"></script>
<script src="village/scene.js"></script>
<script src="village/integrate.js"></script>
<script src="vfx/core.js"></script>
<script src="vfx/archer.js"></script>
<script>
/* =====================================================================================================
 *  Archer VFX bench: the real archer (knight.js) + ArcherVFX (vfx/*.js) on a training lane, seen through the real
 *  gameplay camera (fov 38, iso offset 0 / 5.5 / 8.6, middle-drag orbit, wheel zoom 3.5-24 m).
 *  URL: ?world=village (real village ground) · ?skill=pierce (cast once on load) · ?cam=game|archer|far|close|side|top|target
 *  Automation: window.__bench = { cast, advance(seconds), setCam, AV, archer, targets, set(key, value) } (tools/archervfx.mjs)
 * ===================================================================================================== */
(function () {
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const V3 = THREE.Vector3;
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: q.has('shot') });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const BG = 0x16252f;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(BG); scene.fog = new THREE.Fog(BG, 24, 64);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);

  /* ---------- the game's lighting (same values as index.html) ---------- */
  (function makeEnv() {
    const s = new THREE.Scene(), geo = new THREE.SphereGeometry(10, 24, 16), p = geo.attributes.position, col = [];
    const top = new THREE.Color(0xe4efff), mid = new THREE.Color(0x7d96ad), bot = new THREE.Color(0x182733);
    for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 10; const c = y > 0 ? mid.clone().lerp(top, Math.pow(y, 0.7)) : mid.clone().lerp(bot, Math.min(1, -y * 1.6)); col.push(c.r, c.g, c.b); }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    s.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const soft = (w, h, pos, k, color) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m); };
    soft(7, 3, [-6, 6, 5], 5, 0xfff2e0); soft(4, 7, [7, 3, -5], 3, 0x9cc8ff); soft(5, 2, [0, 8, -3], 2, 0xffffff);
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(s, 0.02).texture; pm.dispose();
  })();
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x2a3a46, 0.45));
  const sun = new THREE.DirectionalLight(0xfff1dd, 1.0);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 }); sun.shadow.bias = -0.0006;
  scene.add(sun, sun.target);
  const SUN_OFF = new V3(-6, 12, 7);
  const rim = new THREE.DirectionalLight(0x7fb2ff, 0.55); rim.position.set(5, 5, -7); scene.add(rim);
  const fxLight = new THREE.PointLight(0xff9040, 0, 9, 2); scene.add(fxLight);   // fire flashes (the game maps this hook to its blast light)
  let fxLightI = 0;

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ color: 0x20384a, roughness: 1, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new THREE.GridHelper(120, 120, 0x3b5d75, 0x2c4659); grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.45; scene.add(grid);
  const VW = q.get('world') === 'village' && window.Village ? Village.forGame({ renderer, scene, camera, sun, rim }) : null;
  if (VW) { ground.visible = false; grid.visible = false; }

  /* ---------- archer ---------- */
  const archer = new Knight({ cls: 'archer' });
  scene.add(archer.root); scene.add(archer.trail.mesh); scene.add(archer.slash.group);
  const ORIGIN = new V3(), sp = VW ? VW.spawn('training') : null;
  if (sp) ORIGIN.copy(sp.position);
  archer.root.position.copy(ORIGIN);
  let yaw = 0;

  /* ---------- targets: a lane of three (pierce), two flankers (volley fan), optional wall / creatures ---------- */
  const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0, flatShading: true }, o || {}));
  function makeDummy() {
    const g = new THREE.Group();
    const wood = mat(0x7b5233), straw = mat(0xd2b26d), red = mat(0xb5382f), white = mat(0xf0e6ce), iron = mat(0x4a5564, { metalness: 0.5, roughness: 0.5 });
    const mats = [wood, straw, red, white, iron];
    const add = (p, geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x || 0, y || 0, z || 0); o.castShadow = true; o.receiveShadow = true; p.add(o); return o; };
    add(g, new THREE.CylinderGeometry(0.75, 0.85, 0.16, 12), wood, 0, 0.08, 0);
    const piv = new THREE.Group(); piv.position.y = 0.16; g.add(piv);
    add(piv, new THREE.CylinderGeometry(0.1, 0.12, 1.9, 7), wood, 0, 0.95, 0);
    add(piv, new THREE.BoxGeometry(1.25, 0.12, 0.12), wood, 0, 1.6, 0);
    add(piv, new THREE.CylinderGeometry(0.34, 0.3, 0.85, 8), straw, 0, 1.3, 0).scale.z = 0.8;
    for (const [r, m, z] of [[0.3, red, 0.28], [0.2, white, 0.285], [0.1, red, 0.29]]) { const d = add(piv, new THREE.CylinderGeometry(r, r, 0.03, 14), m, 0, 1.35, z); d.rotation.x = Math.PI / 2; }
    add(piv, new THREE.SphereGeometry(0.27, 8, 6), straw, 0, 2.0, 0);
    scene.add(g);
    return { g, piv, mats, th: 0, om: 0, axis: new V3(1, 0, 0), flash: 0 };
  }
  const targets = [];
  function addTarget(id, kind) {
    const T = { id, kind, home: new V3(), phase: Math.random() * 6.28, active: true, key: id };
    if (kind === 'dummy') {
      T.D = makeDummy(); T.obj = T.D.g; T.pos = T.D.g.position; T.radius = 0.42; T.height = 2.25; T.attach = T.D.piv; T.surface = 'wood'; T.aimY = 1.35; T.stick = 2.5;
    } else {
      const v = new CreatureKit.CreatureView(kind), D = CREATURE_DEFS.SPECIES[kind];
      scene.add(v.root); v.play && v.play('idle');
      T.v = v; T.obj = v.root; T.pos = v.root.position; T.radius = D.radius; T.height = Math.max(D.height, 1.2); T.surface = 'flesh';
      T.attach = v.bones && v.tpl ? v.bones[v.tpl.idx.body] : v.root; T.aimY = Math.min(1.4, Math.max(0.35, D.height * 0.55)); T.stick = D.height < 0.9 ? 0.01 : 2.5;
    }
    T.anchor = { key: id, pos: T.pos, height: T.height, radius: T.radius, alive: () => T.active };
    targets.push(T); return T;
  }
  function removeTarget(T) { T.active = false; if (T.obj.parent) T.obj.parent.remove(T.obj); targets.splice(targets.indexOf(T), 1); }
  const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 2.4, 0.6), mat(0x8d877c, { flatShading: false, roughness: 0.95 }));
  wall.castShadow = wall.receiveShadow = true; wall.visible = false; scene.add(wall);
  const LANES = { right: [1, 0], up: [0, -1], down: [0, 1], left: [-1, 0], diag: [0.7071, -0.7071] };
  const S = { dist: 9, lane: 'right', moving: false, creatures: false, wall: false, caps: false, stats: true, stress: false };
  let laneDir = new V3(1, 0, 0), lanePerp = new V3(0, 0, 1);
  function layout() {
    const L = LANES[S.lane]; laneDir.set(L[0], 0, L[1]).normalize(); lanePerp.set(-laneDir.z, 0, laneDir.x);
    for (const T of targets.slice()) removeTarget(T);
    const at = (along, side) => ORIGIN.clone().addScaledVector(laneDir, along).addScaledVector(lanePerp, side);
    const spec = [['T1', 'dummy', S.dist * 0.56, 0], ['T2', S.creatures ? 'goblin' : 'dummy', S.dist * 0.76, 0], ['T3', 'dummy', S.dist, 0],
      ['F1', S.creatures ? 'wolf' : 'dummy', S.dist * 0.76, 1.42], ['F2', 'dummy', S.dist * 0.76, -1.42]];
    for (const [id, kind, along, side] of spec) {
      const T = addTarget(id, kind); T.home.copy(at(along, side));
      if (T.v) T.v.teleport(T.home.x, T.home.z, Math.atan2(-laneDir.x, -laneDir.z)); else { T.pos.copy(T.home); T.obj.rotation.y = Math.atan2(-laneDir.x, -laneDir.z); }
    }
    wall.position.copy(at(S.dist + 3.2, 0)).setY(1.2); wall.rotation.y = Math.atan2(laneDir.x, laneDir.z); wall.visible = S.wall; wall.updateMatrixWorld(true);
    if (!targets.includes(sel)) sel = targets[0];
    yaw = Math.atan2(laneDir.x, laneDir.z); archer.root.rotation.y = yaw;
    rebuildCaps(); applyCam(camMode, true);
  }
  let sel = null;                                               // selected aim target (left click)
  const selRing = new THREE.Mesh(new THREE.RingGeometry(1, 1.05, 72), new THREE.MeshBasicMaterial({ color: 0xc49a55, transparent: true, opacity: 0.7, depthWrite: false }));
  selRing.rotation.x = -Math.PI / 2; scene.add(selRing);
  const capsGroup = new THREE.Group(); scene.add(capsGroup);
  function rebuildCaps() {
    while (capsGroup.children.length) capsGroup.remove(capsGroup.children[0]);
    capsGroup.visible = S.caps;
    for (const T of targets) { const m = new THREE.Mesh(new THREE.CylinderGeometry(T.radius, T.radius, T.height, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0x7dffb0, wireframe: true, transparent: true, opacity: 0.35 })); m.userData.T = T; capsGroup.add(m); }
  }
  function hitReact(T, dir, power) {
    if (T.D) { T.D.axis.set(dir.z, 0, -dir.x).normalize(); T.D.om += 4.5 * power * (T.D.th > 0 ? 0.8 : 1); T.D.flash = 1; }
    else if (T.v) { T.v.flash(0.12); if (T.v.sp && T.v.sp.clips && T.v.sp.clips.includes('hit') && power > 0.5) T.v.play('hit'); }
  }
  const bodyPoint = (T, out) => (out || new V3()).set(T.pos.x, T.aimY, T.pos.z);

  /* ---------- VFX ---------- */
  const _dd = new V3(), _ray = new THREE.Ray(), _cp = new V3(), _ca = new V3(), _a0 = new V3(), _a1 = new V3(), _inv = new THREE.Matrix4(), _la = new V3(), _lb = new V3();
  const TAG_SURF = { fence: 'wood', props: 'wood' };
  function hitTest(a, b, P) {
    _dd.subVectors(b, a); const len = _dd.length(); if (len < 1e-6) return null; _dd.divideScalar(len);
    _ray.set(a, _dd);
    let best = null, bd = Infinity;
    for (const T of targets) {
      if (!T.active || (P.hitSet && P.hitSet.has(T))) continue;
      _a0.set(T.pos.x, 0, T.pos.z); _a1.set(T.pos.x, T.height, T.pos.z);
      const d2 = _ray.distanceSqToSegment(_a0, _a1, _cp, _ca), along = _cp.distanceTo(a);
      if (d2 <= T.radius * T.radius && along <= len + 0.05 && along < bd) {
        bd = along;
        best = { point: _ca.clone().addScaledVector(_dd, -T.radius * 0.6), surface: T.surface, target: T, attach: T.attach, stick: T.stick };
      }
    }
    if (wall.visible) {                                          // segment vs the wall box (local slab test)
      _inv.copy(wall.matrixWorld).invert(); _la.copy(a).applyMatrix4(_inv); _lb.copy(b).applyMatrix4(_inv);
      const h = [2, 1.2, 0.3]; let t0 = 0, t1 = 1, ok = true;
      for (let k = 0; k < 3 && ok; k++) {
        const p0 = _la.getComponent(k), d = _lb.getComponent(k) - p0;
        if (Math.abs(d) < 1e-9) { if (Math.abs(p0) > h[k]) ok = false; continue; }
        let ta = (-h[k] - p0) / d, tb = (h[k] - p0) / d; if (ta > tb) { const s = ta; ta = tb; tb = s; }
        t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); if (t0 > t1) ok = false;
      }
      if (ok && t0 * len < bd) { bd = t0 * len; best = { point: a.clone().lerp(b, t0), surface: 'stone' }; }
    }
    if (VW) { const wh = VW.projectileHit(a, b); if (wh && wh.point.distanceTo(a) < bd) best = { point: wh.point.clone(), surface: TAG_SURF[wh.shape.tag] || 'stone' }; }
    return best;
  }
  const dots = [];
  let shakeAmt = 0;
  const AV = ArcherVFX.create({
    scene, camera, arrowTemplate: archer.makeArrowMesh(),
    hooks: {
      hitTest,
      onHit(P, hit, pass) {
        const T = hit.target; if (!T || P.style === 'rain') return;

    camera.position.add(lastShake);
    const sT = sel && sel.active ? sel : null;
    selRing.visible = !!sT; if (sT) { selRing.position.set(sT.pos.x, 0.035, sT.pos.z); selRing.scale.setScalar(sT.radius + 0.55); }
    sun.position.copy(archer.root.position).add(SUN_OFF); sun.target.position.copy(archer.root.position);
    if (VW) VW.update(dt, camera, archer.root.position, sun);
  }

  /* ---------- info panel ---------- */
  let frames = 0, fpsT = 0, fps = 0, infoT = 0;
  function info(dt) {
    infoT -= dt; if (infoT > 0) return; infoT = 0.2;
    const L = [];
    L.push('<span class="h">' + (TL.name || 'Bir yetenek seçin (1–9)') + '</span>');
    for (const [t, s] of TL.ev) L.push('<span class="d">' + fmtMs(t) + '</span>  ' + s);
    if (S.stats) {
      const st = AV.stats(), r = renderer.info.render;
      L.push('', '<span class="h">Performans</span>');
      L.push('fps ' + fps + '   çizim ' + r.calls + '   üçgen ' + (r.triangles / 1000).toFixed(0) + 'k');
      L.push('parçacık  add ' + st.add + '  norm ' + st.norm + '  zemin ' + (st.gadd + st.gnorm));
      L.push('iz ' + st.trails + '   düz ' + st.flats + '   ışın ' + st.beams);
      L.push('ok uçan ' + st.projectiles + '  saplı ' + st.stuck + '  havuz ' + st.pool);
      if (st.dropped) L.push('düşen parçacık ' + st.dropped);
      L.push('kalite ' + AV.tuning.quality + '   zaman ' + timeScale.toFixed(2) + '×' + (paused ? '  DURAKLATILDI' : ''));
    }
    $('info').innerHTML = L.join('\n');
  }

  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const raw = Math.min(clock.getDelta(), 0.05);
    if (!paused) simulate(raw * timeScale);
    updateFollowCam(raw);
    applyView();
    if (camMode !== 'follow') controls.update();
    renderer.render(scene, camera);
    frames++; fpsT += raw; if (fpsT > 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    info(raw);
  }
  layout();
  applyCam(camMode, true);
  if (q.get('skill')) archer.whenReady(() => setTimeout(() => cast(q.get('skill')), 300));
  frame();

  /* ---------- automation hooks (tools/archervfx.mjs): deterministic stepping for frame captures ---------- */
  window.__bench = {
    AV, archer, targets, cast, setCam: applyCam, layout,
    select(id) { const T = targets.find((t) => t.id === id); if (T) sel = T; return !!T; },
    set(key, v) { if (key in S) { S[key] = v; if (key === 'creatures' || key === 'lane' || key === 'dist') layout(); if (key === 'wall') wall.visible = v; } else if (key in AV.tuning) AV.tuning[key] = v; else if (key === 'rapidCount') extra.rapidCount = v; },
    ground(id) { const g = GROUNDS.find((x) => x[0] === id); if (g) { ground.material.color.setHex(g[2]); grid.visible = g[3]; } },
    pause(on) { paused = on !== false; },
    advance(seconds, fps) { const h = 1 / (fps || 60); let n = Math.round(seconds / h); while (n-- > 0) simulate(h); controls.update(); renderer.render(scene, camera); },
    timeline: () => TL.ev.map(([t, s]) => fmtMs(t) + '  ' + s).join('\n'),
    ready: (cb) => archer.whenReady(cb),
  };
  archer.whenReady(() => { document.title = 'ready'; });
})();
</script>
</body>
</html>
