<script>
(function () {
  const q = new URLSearchParams(location.search);
  const debugAnim = q.get('anim');
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: !!debugAnim });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.__MOBILE ? 1.25 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const BG = 0x16252f;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 24, 64);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200); window.__camera = camera;

  /* ---------- HUD (hud.js / hud.css): DOM overlay over the canvas, fed with the game state in updateHUD ---------- */
  const _proj = new THREE.Vector3();
  let targetSel = null;                                         // selected target id: the training dummy is the only selectable entity
  const hud = GameHUD.create({
    project: (x, y, z) => _proj.set(x, y, z).project(camera),
    onSkill: (i) => castSkill(i),
    onEscape: () => { if (targetSel) { targetSel = null; return true; } return false; },
    onRestart: () => { location.href = location.pathname; },     // back to the class selection
    onToggleWalk: () => { walkMode = !walkMode; },                 // walk / run knob on the action bar (same as C)
    keys: [['W A S D', 'Hareket'], ['Sağ tık', 'Hedefe: koş ve saldır (tekrar tıkla / basılı tut) · zemine: yürü'], ['1 – 8', 'Yetenekler (Q = 1)'],
      ['C', 'Yürü / koş'], ['Orta tuş', 'Kamerayı döndür (sürükle)'], ['Tekerlek', 'Yakınlaştır / uzaklaştır'], ['P · K · M · I', 'Karakter · Yetenekler · Harita · Envanter'], ['Enter', 'Sohbet satırı'],
      ['Esc', 'Pencereyi kapat · hedefi bırak · menü'], ['E · X · R', 'Geliştirici: darbe al · öl · diril']],
  });
  window.__hud = hud;
  /* Atherion online hooks: menü şeridindeki "Çıkış" düğmesi → onay modalı (app/screens.js);
     Enter ile yazılan satır → Genel kanal (app/net.js sunucuya iletir; sunucu yoksa eski lokale davranış) */
  hud.onExit = () => AtherionScreens.exitConfirm();
  hud.onChatSend = (text) => { if (window.Net && Net.ready) { Net.chat(text); return true; } return false; };
  Net.init({
    scene,
    log: (t, tone) => hud.logLine('system', t, tone || 'sys'),
    onChatLine: (m) => hud.log.add('global', m.text, '', m.from),
    recentChat: (lines) => { for (const l of lines) if (l) hud.log.add('global', l.text, '', l.from); },
    welcome: (you) => hud.logLine('system', (you.name || 'Kahraman') + ' sunucuya bağlandı. Çevrimiçisin.', 'sys'),
    onClose: () => hud.logLine('system', 'Sunucu bağlantısı kesildi (girilince tekrar denenir).', 'sys'),
  });

  /* ---------- environment (gives the metal something to reflect) ---------- */
  (function makeEnv() {
    const s = new THREE.Scene();
    const geo = new THREE.SphereGeometry(10, 24, 16);
    const p = geo.attributes.position, col = [];
    const top = new THREE.Color(0xe4efff), mid = new THREE.Color(0x7d96ad), bot = new THREE.Color(0x182733);
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / 10;
      const c = y > 0 ? mid.clone().lerp(top, Math.pow(y, 0.7)) : mid.clone().lerp(bot, Math.min(1, -y * 1.6));
      col.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    s.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const soft = (w, h, pos, intensity, color) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
      m.position.set(pos[0], pos[1], pos[2]); m.lookAt(0, 0, 0); s.add(m);
    };
    soft(7, 3, [-6, 6, 5], 5, 0xfff2e0);   // key softbox
    soft(4, 7, [7, 3, -5], 3, 0x9cc8ff);   // cool rim strip
    soft(5, 2, [0, 8, -3], 2, 0xffffff);
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(s, 0.02).texture;
    pm.dispose();
  })();

  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x2a3a46, 0.45));
  const sun = new THREE.DirectionalLight(0xfff1dd, 1.0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = -8; sc.right = 8; sc.top = 8; sc.bottom = -8; sc.near = 1; sc.far = 40;
  sun.shadow.bias = -0.0006;
  scene.add(sun, sun.target);
  const SUN_OFF = new THREE.Vector3(-6, 12, 7);
  const rim = new THREE.DirectionalLight(0x7fb2ff, 0.55);
  rim.position.set(5, 5, -7); scene.add(rim);

  // ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ color: 0x20384a, roughness: 1, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new THREE.GridHelper(120, 120, 0x3b5d75, 0x2c4659);
  grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.45; scene.add(grid);
  /* ---------- castle village (village/*.js): the starter town replaces the debug grid. ?world=arena keeps the old test arena ----------
     The invisible ground plane stays the click-to-move ray target (all walkable ground is exactly y = 0). */
  const VW = (!debugAnim && window.Village && q.get('world') !== 'arena') ? Village.forGame({ renderer, scene, camera, sun, rim }) : null;
  if (VW) { ground.visible = false; ground.scale.set(4, 4, 1); grid.visible = false; }
  if (VW && VW.World) { ground.scale.set(8, 10, 1); ground.position.set(0, 0, 900); ground.updateMatrixWorld(); }   // open world: the click-to-move ray plane must cover the whole map (it ended at z = 480)
  /* VERTICAL FRAME (world/layout.js + village/scene.js): the hero is always at y = 0, the world group moves by -yBase.
     fY(x, z) = ground height in the frame at a point (0 without the open world): use it for anything that sits on the
     ground at a place other than the hero (creatures, targets, impacts, markers). */
  const fY = (x, z) => (VW && VW.frameY ? VW.frameY(x, z) : 0);

  // right-click move marker (vfx/marker.js): amber ring + chevrons snapping in, breathing while walking, fading on arrival
  const moveMark = MoveMarker.create(THREE, scene), marker = moveMark.group;
  // selected-target ring on the ground (neutral = amber); faded in / out by updateHUD
  const targetRing = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.05, 72), new THREE.MeshBasicMaterial({ color: 0xc49a55, transparent: true, opacity: 0, depthWrite: false }));
  targetRing.rotation.x = -Math.PI / 2; targetRing.position.y = 0.035; scene.add(targetRing);

  /* ---------- knight ---------- */
  const forcedCls = q.get('cls');
  const heroes = {};
  let knight;
  if (debugAnim || forcedCls) knight = heroes[forcedCls || 'warrior'] = new Knight({ cls: forcedCls || 'warrior' });
  else { for (const c of ['warrior', 'archer', 'mage']) heroes[c] = new Knight({ cls: c }); knight = heroes.warrior; }
  for (const k in heroes) { const h = heroes[k]; scene.add(h.root); scene.add(h.trail.mesh); scene.add(h.slash.group); if (VW && VW.World) h.groundAt = fY; }   // walkable hills: feet ride the terrain (knight.js _footGround)
  window.__knight = knight;
  let selecting = !debugAnim && !forcedCls;
  hud.setPerf({ tris: Math.round(knight.triangles) });

  /* ---------- training dummy ---------- */
  const dummy = (function () {
    const g = new THREE.Group();
    const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0, flatShading: true }, o || {}));
    const wood = mat(0x7b5233), straw = mat(0xd2b26d), red = mat(0xb5382f), white = mat(0xf0e6ce), iron = mat(0x4a5564, { metalness: 0.5, roughness: 0.5 });
    const mats = [wood, straw, red, white, iron];
    const add = (p, geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x || 0, y || 0, z || 0); o.castShadow = true; o.receiveShadow = true; p.add(o); return o; };
    add(g, new THREE.CylinderGeometry(0.75, 0.85, 0.16, 12), wood, 0, 0.08, 0);
    add(g, new THREE.CylinderGeometry(0.78, 0.78, 0.04, 12), iron, 0, 0.18, 0);
    const piv = new THREE.Group(); piv.position.y = 0.16; g.add(piv);
    add(piv, new THREE.CylinderGeometry(0.1, 0.12, 1.9, 7), wood, 0, 0.95, 0);
    add(piv, new THREE.BoxGeometry(1.25, 0.12, 0.12), wood, 0, 1.6, 0);
    add(piv, new THREE.CylinderGeometry(0.34, 0.3, 0.85, 8), straw, 0, 1.3, 0).scale.z = 0.8;
    for (const [r, m, z] of [[0.3, red, 0.28], [0.2, white, 0.285], [0.1, red, 0.29]]) {
      const d = add(piv, new THREE.CylinderGeometry(r, r, 0.03, 14), m, 0, 1.35, z); d.rotation.x = Math.PI / 2;
    }
    add(piv, new THREE.SphereGeometry(0.27, 8, 6), straw, 0, 2.0, 0);
    add(piv, new THREE.CylinderGeometry(0.36, 0.36, 0.06, 8), iron, 0, 0.95, 0).scale.z = 0.8;
    add(piv, new THREE.CylinderGeometry(0.31, 0.31, 0.06, 8), iron, 0, 1.64, 0).scale.z = 0.8;
    if (VW) g.position.set(VW.registry.dummies[0].x, 0, VW.registry.dummies[0].z); else g.position.set(2.0, 0, -3.8);
    scene.add(g);
    return { g, piv, mats, th: 0, om: 0, axis: new THREE.Vector3(1, 0, 0), flash: 0 };
  })();
  window.__dummy = dummy.g;
  // the dummy is a swept-blade hit target (vertical capsule)
  for (const k in heroes) heroes[k].hitTargets.push({ id: 'dummy', pos: dummy.g.position, radius: 0.42, height: 2.25 });
  function dummyHit(dirX, dirZ, power) {
    dummy.axis.set(dirZ, 0, -dirX).normalize();
    dummy.om += 4.5 * power * (dummy.th > 0 ? 0.8 : 1);
    dummy.flash = 1;
  }

  /* ---------- creatures (creatures/*.js): the local authority simulates them, the world renders them ----------
     They join every hero's hitTargets as capsules (tg.creature set); damage on them goes through creatures.damage(). */
  const creatures = (debugAnim || q.has('nocreatures')) ? null : CreatureWorld.create({
    scene, camera, heroes, obstacles: [{ x: dummy.g.position.x, z: dummy.g.position.z, r: 0.55 }].concat(VW ? VW.creatureObstacles() : []), net: q.get('net'),
    viewRadius: VW && VW.World ? 75 : undefined, activeRadius: VW && VW.World ? 85 : undefined,   // open world (~350 creatures): views + AI only near the hero
    collide: VW ? (p, r) => VW.collide(p, r) : null,              // creatures: same walls / fences / props as the hero   // ?net=loopback: server + latency
    zones: (VW ? VW.creatureZones : (z) => z)(CREATURE_DEFS.ZONES.filter((z) => CreatureKit.SPECIES[z.species])),   // village: camps re-sited south of the gate
  });
  window.__creatures = creatures;
  const isCreature = (tg) => !!(tg && tg.creature);
  if (VW) VW.addTrainingTargets(heroes);                        // village: dummies #2-#4 + three archery butts in the training yard

  /* ---------- particles ---------- */
  const parts = [];
  const pGeo = new THREE.OctahedronGeometry(1, 0);
  for (let i = 0; i < 110; i++) {
    const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false }));
    m.visible = false; scene.add(m);
    parts.push({ m, v: new THREE.Vector3(), life: 0, max: 1, size: 0.1, grav: 0, grow: 0, a: 1 });
  }
  // soft round puffs for dust (growing particles): camera-facing sprites with a radial falloff, not hard-edged gems
  const puffTex = (function () {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  for (let i = 0; i < 70; i++) {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color: 0xffffff, transparent: true, depthWrite: false }));
    m.visible = false; scene.add(m);

      } else if (engage.presses > 0 || mouseHeld) { if (!knight.dead) strikeAt(T); engage.presses = 0; }
    } else if (moveTarget) {
      const st = movePath ? VW.steer(movePath, knight.root.position) : moveTarget;   // village: follow the A* waypoints
      if (st) dir.set(st.x - knight.root.position.x, 0, st.z - knight.root.position.z);
      if (!st || (st === moveTarget && dir.length() < 0.15)) { moveTarget = null; movePath = null; } else { dir.normalize(); move = 1; }
    }
    if ((forced === 'run' || forced === 'walk') && move === 0) move = 1;

    const a = knight.action;
    const swinging = !!(a && a.def.attack);
    const locked = !knight.canMove;
    // ground speed ramps up / down (start -> walk -> run, stop -> run -> walk -> idle); the knight blends gaits by it
    const wantSpeed = locked ? 0 : move * ((walkMode || forced === 'walk') ? Knight.WALK_SPEED : Knight.RUN_SPEED);
    if (move > 0) lastDir.copy(dir);
    curSpeed = locked ? 0 : curSpeed + Math.max(-14 * dt, Math.min(9 * dt, wantSpeed - curSpeed));
    prev.copy(knight.root.position);
    if (curSpeed > 0.01 && lastDir.lengthSq() > 0) {
      knight.root.position.addScaledVector(lastDir, curSpeed * dt);
      if (move > 0) yaw += angDiff(Math.atan2(dir.x, dir.z), yaw) * (1 - Math.exp(-14 * dt));
    }
    // ranged classes: face the aim point while drawing / charging (until the release)
    if (a && a.def.ranged && a.t < a.def.impact - 0.02) {
      const tgt = rangedAim || null;
      if (tgt) {
        const want = Math.atan2(tgt.x - knight.root.position.x, tgt.z - knight.root.position.z);
        yaw += angDiff(want, yaw) * (1 - Math.exp(-16 * dt));
      }
    }
    // soft auto-aim: while winding up a swing, turn toward the target if it is close and roughly in front
    if (swinging && !a.def.ranged) {
      const imp = Array.isArray(a.def.impact) ? a.def.impact[0] : a.def.impact;
      if (a.t < imp - 0.02) {
        let tx = dummy.g.position.x - knight.root.position.x, tz = dummy.g.position.z - knight.root.position.z;
        const kp0 = knight.root.position, selA = creatures && creatures.byKey(targetSel);   // creatures: the selected one, else the closest in front
        const ca = selA && selA.alive && Math.hypot(selA.x - kp0.x, selA.z - kp0.z) < 5.5 ? selA
          : creatures && creatures.nearest(kp0.x, kp0.z, 3.5, (c) => Math.abs(angDiff(Math.atan2(c.x - kp0.x, c.z - kp0.z), yaw)) < 1.9);
        if (ca && Math.hypot(ca.x - kp0.x, ca.z - kp0.z) < Math.hypot(tx, tz)) { tx = ca.x - kp0.x; tz = ca.z - kp0.z; }
        if (Math.hypot(tx, tz) < 5.5) {
          const want = Math.atan2(tx, tz);
          if (Math.abs(angDiff(want, yaw)) < 1.9) yaw += angDiff(want, yaw) * (1 - Math.exp(-24 * dt));
        }
      }
    }
    knight.root.rotation.y = yaw;
    knight.update(dt, { move: curSpeed > 0.05 ? 1 : 0, speed: curSpeed });
    if (VW) { VW.collide(knight.root.position); VW.setFrame(knight.root.position); }   // village: buildings, walls, props, world boundary; then the vertical frame follows the ground under the hero

    // keep the knight out of the dummy
    const ddx = knight.root.position.x - dummy.g.position.x, ddz = knight.root.position.z - dummy.g.position.z;
    const dd = Math.hypot(ddx, ddz), minD = 1.05;
    if (dd < minD && dd > 1e-4) { knight.root.position.x = dummy.g.position.x + ddx / dd * minD; knight.root.position.z = dummy.g.position.z + ddz / dd * minD; }
    // creatures: step the authority (AI, attacks, hit windows) with the hero's position, then sync the rendered views
    if (creatures) creatures.update(dt, { x: knight.root.position.x, z: knight.root.position.z, alive: !!hero && hero.hp > 0 && !knight.dead });
    // online: uzak oyuncu interp + kendi konumum/ilerlemem 10 Hz sunucuya (WorldService düzenli disk'e yazar); zone kimliği de
    if (window.Net && Net.ready) {
      const zn = VW && VW.zoneName ? VW.zoneName(knight.root.position.x, knight.root.position.z) : '';
      Net.frame(dt, knight.root.position, knight.root.rotation.y,
        { level: hero ? hero.level : 1, exp: hero ? hero.exp : 0, hp: hero ? hero.hp : 1, zone: zn });
    }

    // time scale for world fx so they freeze together with the knight's hit-stop
    timeScale = knight.hitStopT > 0 ? 0.04 : 1;
    const wdt = dt * timeScale;

    // dummy spring
    dummy.om += (-70 * dummy.th - 5.5 * dummy.om) * wdt;
    dummy.th += dummy.om * wdt;
    dummy.piv.quaternion.setFromAxisAngle(dummy.axis, dummy.th);
    dummy.flash = Math.max(0, dummy.flash - dt * 5);
    for (const m of dummy.mats) { m.emissive.setRGB(dummy.flash * 0.5, dummy.flash * 0.4, dummy.flash * 0.25); }

    // particles
    for (const p of parts) {
      if (p.life <= 0) continue;
      p.life -= wdt;
      if (p.life <= 0) { p.m.visible = false; continue; }
      p.v.y += p.grav * wdt;
      p.m.position.addScaledVector(p.v, wdt);
      if (p.grav < 0) { const fl = fY(p.m.position.x, p.m.position.z) + 0.03; if (p.m.position.y < fl) { p.m.position.y = fl; p.v.y *= -0.3; p.v.x *= 0.6; p.v.z *= 0.6; } }
      const u = 1 - p.life / p.max;
      p.m.scale.setScalar(p.grow ? p.size * (1 + u * p.grow) : p.size * (1 - u * 0.85));
      p.m.material.opacity = p.a * (1 - u);
    }

    updateFlares(dt);   // real time: the flare plays through the hit-stop
    AV.update(dt);      // archer: arrows, trails, bow / buff / hop effects (vfx/archer.js)
    IFX.update(dt); PFX.update(dt);   // impact: hit / kill feedback, EXP orbs, level-up (real time: Atherion's hit fx ignore the hit-stop)
    updateMagic(dt);
    if (MFX) MFX.update(dt);   // magefx: mage spells (after updateMagic, which resets the shared lights)
    updateHUD(dt);

    // pips fade
    if (pipT > 0) { pipT -= dt; if (pipT <= 0) hud.combo(0); }
    hud.tick(dt);

    // camera follows the knight (MOBA style), keeping the user's orbit; shake + fov punch on top
    const delta = knight.root.position.clone().sub(prev);
    camera.position.sub(lastShake);
    camera.position.add(delta); controls.target.add(delta);
    controls.update();
    shake *= Math.exp(-dt * 13); punch *= Math.exp(-dt * 9);
    // local-player camera shake: random trauma + a short kick along the hit direction
    shakeDir.multiplyScalar(Math.exp(-dt * 22));
    lastShake.set((Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)).multiplyScalar(shake * 0.8).add(shakeDir);
    camera.position.add(lastShake);
    if (VW && VW.World) {                                          // vertical frame: never let the orbiting camera sink into a slope
      const minY = fY(camera.position.x, camera.position.z) + 1.2;
      if (camera.position.y < minY) { camera.position.y = minY; camera.lookAt(controls.target); }
    }
    const fov = 38 - punch * 2.2;
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }

    sun.position.copy(knight.root.position).add(SUN_OFF);
    sun.target.position.copy(knight.root.position);
    if (VW) { VW.updateTargets(wdt); VW.update(dt, camera, knight.root.position, sun); }   // village: dummies, roof fade, clutter LOD, shadow snapping
    moveMark.update(dt, !!moveTarget);
    if (moveTarget && VW && VW.World) marker.position.y = fY(marker.position.x, marker.position.z) + 0.035;   // the move marker rides the slope

    renderer.render(scene, camera);
    frames++; fpsT += dt;
    if (fpsT > 0.5) { hud.setPerf({ fps: Math.round(frames / fpsT) }); frames = 0; fpsT = 0; }
  }
  tick();
})();
</script>
<script src="mobile.js"></script>
</body>
</html>
