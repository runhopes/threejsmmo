<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creature Showcase (dev)</title>
<style>
  :root { --bg:#16252f; --panel:rgba(12,22,30,.86); --line:rgba(160,200,230,.22); --txt:#dcecf7; --dim:#8fb0c6; --acc:#e3b540; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font:12px/1.4 system-ui,Segoe UI,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  #ctl { top:10px; left:10px; width:300px; max-height:calc(100% - 20px); overflow:auto; }
  #ctl h3 { margin:9px 0 4px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  #ctl h3:first-child { margin-top:0; }
  .row { display:flex; flex-wrap:wrap; gap:4px; }
  button { all:unset; cursor:pointer; padding:4px 8px; border-radius:5px; border:1px solid var(--line); background:rgba(255,255,255,.04); font-weight:600; }
  button:hover { background:rgba(255,255,255,.12); }
  button.on { background:var(--acc); color:#1b1b1b; border-color:var(--acc); }
  label { display:flex; align-items:center; gap:6px; margin:3px 0; }
  input[type=range] { flex:1; }
  #info { top:10px; right:10px; width:310px; font:11px/1.5 ui-monospace,Consolas,monospace; white-space:pre; }
  #err { position:fixed; left:330px; top:8px; color:#ff6b6b; font:12px monospace; white-space:pre-wrap; z-index:9; }
  .lbl { position:fixed; color:#dcecf7; font:600 12px system-ui; padding:3px 7px; background:#0009; border-radius:5px; z-index:5; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="ctl" class="panel">
  <h3>Tür</h3><div class="row" id="spRow"></div>
  <h3>Animasyon</h3><div class="row" id="animRow"></div>
  <h3>Oynatma</h3>
  <label>Hız <input type="range" id="speed" min="0.05" max="2" step="0.05" value="1"><span id="speedV">1.00x</span></label>
  <div class="row"><button id="pause">Duraklat</button><button id="step">Kare +</button><button id="circle">Daire yürüyüşü</button></div>
  <h3>Hata ayıklama</h3>
  <div class="row"><button id="dJoints">Eklemler</button><button id="dHit">Vuruş kapsülleri</button><button id="dHero">Kahraman ölçeği</button><button id="dLod">LOD1 zorla</button><button id="dWire">Tel kafes</button></div>
  <h3>Kamera</h3>
  <div class="row" id="camRow"></div>
  <h3>Performans</h3>
  <div class="row"><button id="stress">Stres testi (140)</button><button id="clear">Temizle</button></div>
</div>
<div id="info" class="panel"></div>

<script>window.addEventListener('error', (e) => { document.getElementById('err').textContent += 'ERR: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')\n'; document.title = 'ERR'; });</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="textures.js"></script>
<script src="locomotion.js"></script>
<script src="heromodel.js"></script>
<script src="knight.js"></script>
<script src="creatures/defs.js"></script>
<script src="creatures/core.js"></script>
<script>
  // species files load dynamically (one file may define several species: boar.js also defines spikeback)
  window.CREATURE_FILES = { rat: 'rat', rabbit: 'rabbit', snake: 'snake', boar: 'boar', spikeback: 'boar', wolf: 'wolf', goblin: 'goblin', panther: 'panther', bear: 'bear', troll: 'troll', stag: 'stag' };
  // variants (CREATURE_DEFS.VARIANTS, defs.js) render with their base species' file; ?sp=variants shows all of them, ?sp=cmp every variant next to its base
  (function () {
    const want = new URLSearchParams(location.search).get('sp') || 'all';
    const V = CREATURE_DEFS.VARIANTS, FILE_OF = (i) => CREATURE_FILES[i] || (V[i] && CREATURE_FILES[V[i].base]);
    const ids = want === 'all' || want === 'variants' || want === 'cmp' ? Object.keys(CREATURE_FILES) : want.split(',');
    const files = [...new Set(ids.map(FILE_OF).filter(Boolean))];
    for (const f of files) document.write('<script src="creatures/species/' + f + '.js" onerror="this.dataset.missing=1"><' + '/script>');
    document.write('<script src="creatures/variants.js"><' + '/script>');
  })();
</script>
<script>
(function () {
  const K = CreatureKit, D = CREATURE_DEFS;
  const q = new URLSearchParams(location.search);
  const shotMode = q.has('t') || q.has('strip') || q.has('sheet');
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: shotMode });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const BG = 0x16252f, scene = new THREE.Scene(); scene.background = new THREE.Color(BG); scene.fog = new THREE.Fog(BG, 24, 64);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
  // same environment + lights as the game (index.html)
  (function makeEnv() {
    const s = new THREE.Scene(), geo = new THREE.SphereGeometry(10, 24, 16), p = geo.attributes.position, col = [];
    const top = new THREE.Color(0xe4efff), mid = new THREE.Color(0x7d96ad), bot = new THREE.Color(0x182733);
    for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 10; const c = y > 0 ? mid.clone().lerp(top, Math.pow(y, 0.7)) : mid.clone().lerp(bot, Math.min(1, -y * 1.6)); col.push(c.r, c.g, c.b); }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    s.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const soft = (w, h, pos, k, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m); };
    soft(7, 3, [-6, 6, 5], 5, 0xfff2e0); soft(4, 7, [7, 3, -5], 3, 0x9cc8ff); soft(5, 2, [0, 8, -3], 2, 0xffffff);
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(s, 0.02).texture; pm.dispose();
  })();
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x2a3a46, 0.45));
  const sun = new THREE.DirectionalLight(0xfff1dd, 1.0); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 }); sun.shadow.bias = -0.0006; scene.add(sun, sun.target);
  const SUN_OFF = new THREE.Vector3(-6, 12, 7);
  const rim = new THREE.DirectionalLight(0x7fb2ff, 0.55); rim.position.set(5, 5, -7); scene.add(rim);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ color: 0x20384a, roughness: 1, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new THREE.GridHelper(120, 240, 0x3b5d75, 0x2c4659); grid.position.y = 0.002; grid.material.transparent = true; grid.material.opacity = 0.45; scene.add(grid);
  const controls = new THREE.OrbitControls(camera, canvas); controls.enableDamping = !shotMode; controls.dampingFactor = 0.12;

  /* ---------------- roster ---------------- */
  const ORDER = ['rat', 'rabbit', 'snake', 'boar', 'wolf', 'goblin', 'spikeback', 'panther', 'bear', 'troll', 'stag'].filter((s) => K.SPECIES[s]);
  const VARIANT_IDS = Object.keys(D.VARIANTS || {}).filter((s) => K.SPECIES[s]);
  const sel = q.get('sp') || 'all';
  const ids = (sel === 'all' ? ORDER : sel === 'variants' ? VARIANT_IDS : sel === 'cmp' ? [].concat(...ORDER.map((b) => [b].concat(VARIANT_IDS.filter((v) => D.VARIANTS[v].base === b)))) : sel.split(',')).filter((s) => K.SPECIES[s]);
  const items = [];
  let x = 0;
  ids.forEach((id, i) => {
    const d = D.SPECIES[id], w = Math.max(0.9, d.radius * 3.2);
    if (i) x += w / 2;
    const v = new K.CreatureView(id);
    scene.add(v.root);
    const home = new THREE.Vector3(-x, 0, 0);       // creatures face +Z (toward the default camera); lined up along -X
    v.teleport(home.x, home.z, parseFloat(q.get('yaw') || '0'));
    items.push({ id, v, d, home, anim: q.get('anim') || 'idle', t: 0, lastAct: -99, angle: 0, path: 0 });
    x += w / 2 + 0.35;
  });
  // lineup spans x in [-x, 0.5] (+ the scale hero at +1.2 when shown)
  const minX = -x + 0.35, maxX = q.has('hero') ? 1.7 : 0.5;
  const center = new THREE.Vector3((minX + maxX) / 2, 0, 0);
  let hero = null;
  function ensureHero() {
    if (hero || !window.Knight) return hero;
    hero = new Knight({ cls: 'warrior' }); hero.root.position.set(1.2, 0, 0); scene.add(hero.root);   // beside the lineup, same ground line
    hero.root.visible = false; return hero;
  }

  /* ---------------- driving animations (mini authority: moves the root exactly like creatures/sim.js would) ---------------- */
  const speedOf = (it, mode) => (it.d.speed[mode] || it.d.speed.run);
  const LOCO = { idle: 0, walk: 'walk', run: 'run', stalk: 'stalk', charge: 'charge', slither: 'walk', hop: 'walk', sprint: 'run', trot: 'walk' };
  let circleMode = q.has('circle');
  function startAnim(it, name) {
    it.anim = name; it.t = 0; it.lastAct = -99; it.lunge0 = null;
    const v = it.v;
    if (name === 'death' || v.dead) { v.sm.reset(); if (v.anim.reset) v.anim.reset(); }
    v.teleport(it.home.x, it.home.z, v.root.rotation.y);
    if (name === 'death') v.play('death', { data: { side: Math.random() < 0.5 ? 1 : -1 } });
  }
  const _f = new THREE.Vector3();
  function drive(it, dt) {
    const v = it.v, name = it.anim, a = it.d.attacks[name];
    it.t += dt;
    const lm = LOCO[name];
    if (lm !== undefined && lm !== 0) {
      const spd = speedOf(it, lm);
      if (circleMode) {
        const R = Math.max(1.2, spd * 0.9);
        it.angle += spd / R * dt;
        v.root.position.set(it.home.x + R * Math.sin(it.angle) - 0, 0, it.home.z + R * (1 - Math.cos(it.angle)) - R);
        v.root.rotation.y = it.angle + Math.PI / 2 - Math.PI / 2;
        v.root.rotation.y = Math.atan2(Math.cos(it.angle), Math.sin(it.angle));
      } else {
        v.root.position.z += spd * dt;
        if (!shotMode && v.root.position.z - it.home.z > 6) { v.teleport(it.home.x, it.home.z - 1.5, v.root.rotation.y); }   // loop the track
      }
      if (v.anim.setMode) v.anim.setMode(lm);
    } else if (v.anim.setMode) v.anim.setMode(null);
    if (a) {                                             // attack: replay with its authoritative root motion
      if (it.t - it.lastAct > a.dur + 0.55) { it.lastAct = it.t; v.teleport(it.home.x, it.home.z, v.root.rotation.y); v.play(name, {}); it.lunge0 = v.root.position.clone(); it.yaw0 = v.root.rotation.y; }
      const u = Math.min(1, (it.t - it.lastAct) / a.dur);
      if (it.lunge0) { const s = D.lungeAt(a, u); v.root.position.set(it.lunge0.x + Math.sin(it.yaw0) * s, 0, it.lunge0.z + Math.cos(it.yaw0) * s); }
    } else if (name === 'hit') {
      if (it.t - it.lastAct > 1.1) { it.lastAct = it.t; v.anim.hit(Math.random() - 0.5, -1, 1); v.flash(0.09); if (v.anim.actionDefs.stagger) v.play('stagger'); }
    } else if (name !== 'death' && v.anim.actionDefs[name] && !(lm)) {
      const def = v.anim.actionDefs[name];
      if (it.t - it.lastAct > def.dur + 0.5) { it.lastAct = it.t; v.play(name, {}); }
    }
  }

  /* ---------------- debug overlays ---------------- */
  const dbg = { joints: q.has('joints'), hit: q.has('hitbox'), hero: q.has('hero'), lod: q.has('lod1'), wire: false };
  const capsules = [];
  function syncDebug() {
    for (const it of items) {
      if (dbg.joints && !it.v.debug) it.v.debug = K.debugRig(it.v, scene);
      if (!dbg.joints && it.v.debug) { it.v.debug.dispose(); it.v.debug = null; }
      it.v.setLOD(dbg.lod ? 1 : 0);
    }
    for (const c of capsules) scene.remove(c);
    capsules.length = 0;
    if (dbg.hit) for (const it of items) {
      const g = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color: 0x5cff9a, wireframe: true, transparent: true, opacity: 0.5, depthTest: false });
      const r = it.d.radius, h = it.d.height;
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16, 1, true), m); cyl.position.y = h / 2; g.add(cyl);
      const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.98, r, 32), new THREE.MeshBasicMaterial({ color: 0x5cff9a, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; g.add(ring);
      // attack reach + facing arc of the longest-reach attack (the authority's validateHit numbers), centred on +Z
      const A = Object.values(it.d.attacks).filter((x) => x.reach > 0).sort((p, q2) => q2.reach - p.reach)[0];
      const half = A && A.cosArc > -1 ? Math.acos(Math.max(-1, Math.min(1, A.cosArc))) : Math.PI, a = A ? A.reach : 0;
      const reach = new THREE.Mesh(new THREE.RingGeometry(a + r - 0.015, a + r, 48, 1, -Math.PI / 2 - half, 2 * half), new THREE.MeshBasicMaterial({ color: 0xff7050, side: THREE.DoubleSide, transparent: true, opacity: 0.7 }));
      reach.rotation.x = -Math.PI / 2; reach.position.y = 0.012; g.add(reach);
      g.userData.it = it; g.renderOrder = 40; scene.add(g); capsules.push(g);
    }
    const h = dbg.hero ? ensureHero() : hero; if (h) h.root.visible = dbg.hero;
    for (const it of items) for (const k of [0, 1]) for (const m of it.v.lodMeshes[k]) m.material.wireframe = dbg.wire;
  }

  /* ---------------- cameras ---------------- */
  const maxH = Math.max(...items.map((it) => it.d.height)), span = Math.max(1.4, maxX - minX);
  function camPreset(name, focus) {
    const f = focus || center, H = focus ? (items.find((i) => i.home === focus) || items[0]).d.height : maxH;
    const L = focus ? Math.max(1.2, H * 2.6 + 0.8) : span * 0.9 + 1.5, z = parseFloat(q.get('zoom') || '1');
    const P = {
      front: [0, H * 0.75, L], side: [L, H * 0.7, 0], back: [0, H * 0.8, -L], q34: [L * 0.7, H * 0.95 + 0.25 * L, L * 0.75],
      top: [0, L * 1.3, 0.3], game: [0, 6.8, 8.6], low: [L * 0.6, 0.12, L * 0.6],
    }[name] || [0, H * 0.75, L];
    const tgt = new THREE.Vector3(f.x, name === 'game' ? 0.6 : H * 0.5, f.z);
    if (q.has('tgt')) { const t = q.get('tgt').split(',').map(Number); tgt.set(f.x + t[0], t[1], f.z + t[2]); }
    const off = new THREE.Vector3(...P); if (name !== 'game') off.multiplyScalar(z);
    return { pos: tgt.clone().add(off), tgt, fov: name === 'game' ? 38 : 30 };
  }
  function setCam(name, focus) { const c = camPreset(name, focus); camera.position.copy(c.pos); controls.target.copy(c.tgt); camera.fov = c.fov; camera.updateProjectionMatrix(); controls.update(); }
  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  /* ---------------- UI ---------------- */
  let timeScale = parseFloat(q.get('speed') || '1'), paused = false, stepOnce = false;
  const $ = (id) => document.getElementById(id);
  function btn(row, label, on, fn) { const b = document.createElement('button'); b.textContent = label; if (on) b.classList.add('on'); b.onclick = () => fn(b); row.appendChild(b); return b; }
  btn($('spRow'), 'Hepsi', sel === 'all', () => { location.search = '?sp=all'; });
  btn($('spRow'), 'Varyantlar', sel === 'variants', () => { location.search = '?sp=variants'; });
  for (const id of ORDER) btn($('spRow'), D.SPECIES[id].name, sel === id, () => { location.search = '?sp=' + id; });
  const clipSet = new Set(); for (const it of items) for (const c of it.v.sp.clips) clipSet.add(c);
  for (const c of clipSet) btn($('animRow'), c, items[0] && items[0].anim === c, (b) => {
    document.querySelectorAll('#animRow button').forEach((x) => x.classList.toggle('on', x === b));
    for (const it of items) if (it.v.sp.clips.includes(c)) startAnim(it, c); else startAnim(it, 'idle');
  });
  $('speed').value = timeScale; $('speedV').textContent = timeScale.toFixed(2) + 'x';
  $('speed').oninput = (e) => { timeScale = +e.target.value; $('speedV').textContent = timeScale.toFixed(2) + 'x'; };
  $('pause').onclick = (e) => { paused = !paused; e.target.classList.toggle('on', paused); };
  $('step').onclick = () => { paused = true; stepOnce = true; $('pause').classList.add('on'); };
  $('circle').onclick = (e) => { circleMode = !circleMode; e.target.classList.toggle('on', circleMode); for (const it of items) startAnim(it, it.anim); };
  for (const [id, k] of [['dJoints', 'joints'], ['dHit', 'hit'], ['dHero', 'hero'], ['dLod', 'lod'], ['dWire', 'wire']]) {
    $(id).classList.toggle('on', dbg[k]);
    $(id).onclick = (e) => { dbg[k] = !dbg[k]; e.target.classList.toggle('on', dbg[k]); syncDebug(); };
  }
  for (const c of ['front', 'side', 'q34', 'back', 'top', 'game', 'low']) btn($('camRow'), c, false, () => setCam(c, ids.length === 1 ? items[0].home : null));
  // stress test: many instances of every species, random states, at their real spacing
  const stress = [];
  $('stress').onclick = () => {
    for (let i = 0; i < 140; i++) {
      const id = ORDER[i % ORDER.length], v = new K.CreatureView(id), a = (i / 140) * Math.PI * 2 * 5, r = 6 + i * 0.12;
      scene.add(v.root); v.teleport(Math.cos(a) * r, Math.sin(a) * r, Math.random() * 6.28);
      const clips = v.sp.clips.filter((c) => c !== 'death');
      stress.push({ id, v, d: D.SPECIES[id], home: v.root.position.clone(), anim: clips[i % clips.length], t: Math.random() * 3, lastAct: -99, angle: 0 });
    }
    setCam('game');
  };
  $('clear').onclick = () => { for (const s of stress) s.v.dispose(); stress.length = 0; };

  /* ---------------- per-frame ---------------- */
  const info = $('info');
  let frames = 0, fpsT = 0, fps = 0, updMs = 0;
  function simStep(dt) {
    const t0 = performance.now();
    for (const it of items) { drive(it, dt); it.v.update(dt, 2); }
    const camPos = camera.position;
    for (const s of stress) {
      drive(s, dt);
      const d = camPos.distanceTo(s.v.root.position);          // the game's distance-based update policy
      s.v.setLOD(d > 16 ? 1 : 0); s.v.setShadow(d < 12);
      s.v.update(dt, d < 14 ? 2 : d < 28 ? 1 : 0);
    }
    if (hero && hero.root.visible) hero.update(dt, {});
    for (const c of capsules) { c.position.copy(c.userData.it.v.root.position); c.rotation.y = c.userData.it.v.root.rotation.y; }
    updMs = updMs * 0.9 + (performance.now() - t0) * 0.1;
  }
  function stats() {
    const r = renderer.info.render, mem = renderer.info.memory;
    const lines = [];
    lines.push('fps ' + fps + '   update ' + updMs.toFixed(2) + ' ms (' + (items.length + stress.length) + ' creatures)');
    lines.push('draw calls ' + r.calls + '   tris ' + r.triangles.toLocaleString());
    lines.push('geometries ' + mem.geometries + '   programs ' + (renderer.info.programs || []).length);
    lines.push('');
    lines.push('species       LOD0     LOD1    build');
    for (const id of ORDER) {
      const g0 = K.speciesGeometry(id, 0), g1 = K.speciesGeometry(id, 1);
      lines.push((id + '            ').slice(0, 12) + String(Math.round(g0.tris)).padStart(7) + String(Math.round(g1.tris)).padStart(9) + (g0.ms + g1.ms).toFixed(0).padStart(6) + 'ms');
    }
    lines.push('');
    for (const it of items) {
      const c = it.v.sm.cur;
      lines.push(it.id + ': ' + it.anim + '  v=' + it.v.speedSm.toFixed(2) + ' ' + (it.v.anim.gait ? it.v.anim.gait.gait : '') + (c ? '  [' + c.name + ' ' + (c.t / c.def.dur).toFixed(2) + ']' : ''));
    }
    info.textContent = lines.join('\n');
  }
  function placeSun(f) { sun.position.copy(f).add(SUN_OFF); sun.target.position.copy(f); }

  /* ---------------- screenshot modes ---------------- */
  function runTo(t, dt) { const n = Math.round(t / dt); for (let i = 0; i < n; i++) simStep(dt); }
  function label(text, x, y) { const el = document.createElement('div'); el.className = 'lbl'; el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px'; document.body.appendChild(el); }
  if (shotMode) {
    // render only after every embedded texture (goblin leather / cloth, the scale hero) has decoded
    if (q.has('hero')) ensureHero();
    K.whenTexturesReady(() => { if (hero) hero.whenReady(shoot); else shoot(); });
  }
  function shoot() {
    document.querySelectorAll('.panel').forEach((p) => { if (!q.has('ui')) p.style.display = 'none'; });
    syncDebug();
    for (const it of items) startAnim(it, it.anim);
    const dt = 1 / 120, follow = items.length === 1 ? items[0] : null;
    const camName = q.get('cam') || 'q34';
    const frameCam = (cam, name) => {
      const c = camPreset(name, follow ? follow.home : null);
      const f = follow ? follow.v.root.position : center;
      const delta = follow ? f.clone().sub(follow.home) : new THREE.Vector3();
      cam.position.copy(c.pos).add(delta); cam.lookAt(c.tgt.clone().add(delta)); cam.fov = c.fov; cam.updateProjectionMatrix();
      placeSun(f);
    };
    const W = innerWidth, H = innerHeight;
    renderer.setScissorTest(true);
    if (q.has('strip')) {
      const N = parseInt(q.get('strip')), cols = parseInt(q.get('cols') || '4'), rows = Math.ceil(N / cols), pw = W / cols, ph = H / rows;
      const t0 = parseFloat(q.get('t0') || '0'), t1 = parseFloat(q.get('t1') || '1');
      const cam = new THREE.PerspectiveCamera(30, pw / ph, 0.05, 200);
      let time = 0; runTo(t0, dt); time = t0;
      for (let k = 0; k < N; k++) {
        const want = t0 + (t1 - t0) * (N > 1 ? k / (N - 1) : 0);
        while (time < want - dt * 0.5) { simStep(dt); time += dt; }
        frameCam(cam, camName); cam.aspect = pw / ph; cam.updateProjectionMatrix();
        const px = (k % cols) * pw, py = Math.floor(k / cols) * ph;
        renderer.setViewport(px, H - py - ph, pw, ph); renderer.setScissor(px, H - py - ph, pw, ph);
        renderer.render(scene, cam);
        label('t=' + want.toFixed(2), px + 6, py + 6);
      }
    } else if (q.has('sheet')) {
      runTo(parseFloat(q.get('t') || '0'), dt);
      const views = ['front', 'side', 'q34', 'game'];
      const cam = new THREE.PerspectiveCamera(30, (W / 2) / (H / 2), 0.05, 200);
      views.forEach((vn, k) => {
        const px = (k % 2) * W / 2, py = Math.floor(k / 2) * H / 2;
        frameCam(cam, vn); cam.aspect = (W / 2) / (H / 2);
        if (vn === 'game') { cam.fov = 2 * Math.atan(Math.tan(19 * Math.PI / 180) / 2) * 180 / Math.PI; }     // true in-game pixel size
        cam.updateProjectionMatrix();
        renderer.setViewport(px, H - py - H / 2, W / 2, H / 2); renderer.setScissor(px, H - py - H / 2, W / 2, H / 2);
        renderer.render(scene, cam);
        label(vn === 'game' ? 'GAME CAMERA (true scale)' : vn.toUpperCase(), px + 8, py + 8);
      });
    } else {
      runTo(parseFloat(q.get('t') || '0'), dt);
      frameCam(camera, camName);
      renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H);
      renderer.render(scene, camera);
    }
    window.__shot = { items, K, scene, camera, renderer, simStep };
    document.title = 'ready';
  }
  if (shotMode) return;

  setCam(q.get('cam') || 'q34', ids.length === 1 ? items[0].home : null);
  syncDebug();
  for (const it of items) startAnim(it, it.anim);
  const clock = new THREE.Clock();
  window.__show = { items, K, simStep, scene, camera };
  (function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused || stepOnce) { simStep(stepOnce ? 1 / 60 : dt * timeScale); stepOnce = false; }
    if (ids.length === 1 && items[0]) {                         // single species: the camera follows it (keeps the user's orbit)
      const f = items[0].v.root.position, d = new THREE.Vector3(f.x - controls.target.x, 0, f.z - controls.target.z);
      controls.target.add(d); camera.position.add(d);
    }
    controls.update();
    placeSun(controls.target);
    renderer.render(scene, camera);
    frames++; fpsT += dt; if (fpsT > 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; stats(); }
  })();
  document.title = 'ready';
})();
</script>
</body>
